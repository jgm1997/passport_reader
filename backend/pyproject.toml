[project]
name = "passport-verify"
version = "0.1.0"
description = "Passive Authentication server for ePassport chips"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "asn1crypto>=1.5.1",
    "cryptography>=42",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
